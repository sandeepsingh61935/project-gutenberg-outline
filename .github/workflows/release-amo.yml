name: Release · Firefox AMO

# Submits a NEW VERSION to the existing AMO listing when you push tag v*.
# Add-on is already published — never change gecko id after first list.
# Secrets: AMO_JWT_ISSUER, AMO_JWT_SECRET
# Optional vars: FIREFOX_EXTENSION_ID (must stay project-gutenberg-outline@sandeepsingh61935.github.io),
#                AMO_CHANNEL (listed default | unlisted)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'AMO channel'
        required: true
        default: listed
        type: choice
        options:
          - listed
          - unlisted

permissions:
  contents: write

jobs:
  publish:
    name: Build & submit to AMO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node <<'NODE'
          const fs = require('fs');
          const ver = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (!/^\d+\.\d+\.\d+/.test(ver)) {
            console.error('Tag must be vMAJOR.MINOR.PATCH, got', process.env.GITHUB_REF_NAME);
            process.exit(1);
          }
          for (const file of ['package.json', 'manifest.json']) {
            const j = JSON.parse(fs.readFileSync(file, 'utf8'));
            j.version = ver;
            fs.writeFileSync(file, JSON.stringify(j, null, 2) + '\n');
            console.log(`set ${file} version → ${ver}`);
          }
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Build Firefox package
        env:
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
        run: npm run build:firefox

      - name: web-ext lint
        run: npx web-ext lint --source-dir dist-firefox

      - name: Submit to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_CHANNEL: ${{ github.event.inputs.channel || vars.AMO_CHANNEL || 'listed' }}
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          AMO_APPROVAL_TIMEOUT_MS: '900000'
        run: node scripts/submit-amo.mjs

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amo-release-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: warn

      - name: Attach XPI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
