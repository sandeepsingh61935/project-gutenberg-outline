name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Firefox package · lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build + Firefox package + web-ext lint
        run: npm run lint:ext

      - name: Pack XPI (unsigned)
        run: npm run pack:firefox

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-unsigned
          path: |
            artifacts/
            dist-firefox/
          if-no-files-found: error
